<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the September 2005 Penang recycling directory. Historical listings need current confirmation; checked map pins identify buildings, not confirmed drop-off services.">
  <title>repenang — recycling points</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=materials-20261110c">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="sorting-game.js?v=sorting-20261110c"></script>
  <script defer src="app.js?v=nav-20261110"></script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="#map">repenang</a>
      <nav class="nav" aria-label="Main navigation">
        <button type="button" class="active" data-tab="map" aria-current="page">Map</button>
        <button type="button" data-tab="guide">Guide</button>
        <button type="button" data-tab="feedback"><span class="long-text">Suggest a place</span><span class="short-text">Suggest</span></button>
      </nav>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="Recycling search">
        <div class="searchwrap">
          <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="6" fill="none" stroke="#314b43" stroke-width="1.5"/>
            <path d="m13 13 5 5" fill="none" stroke="#314b43" stroke-width="1.5"/>
          </svg>
          <input id="search" type="search" aria-label="Search items or locations" placeholder="Search an item" autocomplete="off" disabled>
        </div>
        <div class="selectwrap">
          <label class="visually-hidden" for="material">Material</label>
          <select id="material" hidden disabled>
            <option value="all">All materials</option>
            <option value="battery">Batteries</option>
            <option value="e-waste">E-waste</option>
            <option value="plastic">Plastic</option>
            <option value="paper">Paper</option>
            <option value="metal">Metal</option>
          </select>
          <details class="material-menu" id="material-menu">
            <summary aria-label="Choose material"><span id="material-label">Filter by material</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></summary>
            <div class="material-options" id="material-options" aria-label="Materials"></div>
          </details>
        </div>
        <p id="nearest-status" class="nearest-status" role="status" aria-live="polite" hidden></p>
        <div class="results-head">
          <span id="resultcount" role="status">Loading locations…</span>
          <button type="button" class="reset" disabled>Reset</button>
        </div>
        <div class="results" id="results"></div>
        <section class="mobile-sheet" id="mobile-sheet" aria-label="Location details" hidden>
          <button class="dismiss" type="button" aria-label="Close details">×</button>
          <div id="mobile-detail"></div>
        </section>
      </aside>
      <main class="map" id="main" aria-label="Penang recycling map">
        <div id="map" aria-label="Interactive map of Penang Island and Seberang Perai"></div>
        <div class="mapmode" id="mapmode" role="status">2005 directory · recycling not reconfirmed</div>
        <div class="map-error" id="map-error" role="alert" hidden></div>
        <section class="placeholder" id="placeholder" hidden>
          <div class="placeholder-inner"></div>
        </section>
      </main>
    </div>
  </div>
  <noscript>JavaScript is required to load the interactive map and fictional demo points.</noscript>
</body>
</html>
